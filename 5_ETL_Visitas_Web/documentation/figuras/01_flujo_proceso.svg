   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f4e79" x="244.8" y="26.653319" transform="rotate(-0 244.8 26.653319)">Flujo del proceso ETL</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #595959" x="244.8" y="43.169022" transform="rotate(-0 244.8 43.169022)">Cada etapa tiene una condición de salida explícita; si no se cumple, el archivo no avanza</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f4e79" x="132.48" y="64.266295" transform="rotate(-0 132.48 64.266295)">ORIGEN SFTP</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 76.151638)">servidor:/home/etl/archivosVisitas</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 86.287326)">patrón report_&lt;consecutivo&gt;.txt</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2e74b5" x="132.48" y="122.552009" transform="rotate(-0 132.48 122.552009)">ATERRIZAJE</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 134.681478)">descarga a .part, luego rename atómico</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 144.817165)">publicación atómica: nunca queda a medias</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2e74b5" x="132.48" y="205.08458" transform="rotate(-0 132.48 205.08458)">STAGING</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 217.185924)">stg_visitas — copia fiel, todo texto</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 227.089862)">no se transforma ni se corrige nada</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2e74b5" x="132.48" y="263.370295" transform="rotate(-0 132.48 263.370295)">RESPALDO Y PURGA</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 275.571763)">zip verificado en bckp/</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 285.275451)">y solo entonces, borrado en origen</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2e74b5" x="132.48" y="321.656009" transform="rotate(-0 132.48 321.656009)">TRABAJO</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 333.801228)">wrk_visitas — tipificación y marcas de calidad</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(35.136 343.705165)">wrk_dedupe — ranking de duplicados</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #548235" x="132.48" y="396.066295" transform="rotate(-0 132.48 396.066295)">DESTINO</text>
   </g>
   <g id="text_14">
