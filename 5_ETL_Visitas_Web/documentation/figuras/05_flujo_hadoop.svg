" style="fill: #fce4e4; stroke: #a61c1c; stroke-width: 0.9; stroke-linejoin: miter"/>
    </g>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(20.16 405.491213)">Sin llaves primarias ni restricciones UNIQUE: las garantías que hoy impone</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(20.16 414.132795)">el motor pasan a la transformación. Por eso los puntos de control dejan de ser</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(20.16 422.774376)">buena práctica y pasan a ser el único mecanismo de defensa.</text>
   </g>
