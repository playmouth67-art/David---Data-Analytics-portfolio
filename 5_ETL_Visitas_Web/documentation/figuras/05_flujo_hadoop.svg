   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f4e79" x="244.8" y="26.226462" transform="rotate(-0 244.8 26.226462)">El mismo flujo sobre un clúster Hadoop</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #595959" x="244.8" y="42.202165" transform="rotate(-0 244.8 42.202165)">Cambia la mecánica de escritura; la arquitectura lógica y los puntos de control no</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f4e79" x="244.8" y="75.769152" transform="rotate(-0 244.8 75.769152)">ORIGEN SFTP</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(171.108563 87.970621)">ingesta con NiFi o el mismo orquestador;</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(168.400125 97.674308)">quiet period y huella SHA-256 sin cambios</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2e74b5" x="244.8" y="145.583438" transform="rotate(-0 244.8 145.583438)">ZONA RAW (HDFS o S3)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(165.178687 158.232937)">/raw/visitas/dt=YYYY-MM-DD/report_&lt;n&gt;.txt</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(152.133188 168.136875)">texto tal cual, inmutable: es la evidencia del origen</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(130.046625 177.840563)">una tabla EXTERNA de Hive sobre esta zona = el staging actual</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2e74b5" x="244.8" y="234.655915" transform="rotate(-0 244.8 234.655915)">TRANSFORMACIÓN (Spark SQL o Hive)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(156.3705 245.941353)">tipificación, marcas de calidad y ROW_NUMBER()</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(157.521938 256.27729)">la lógica SQL actual se traslada casi sin cambios</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #548235" x="130.14" y="321.469152" transform="rotate(-0 130.14 321.469152)">ZONA CURADA (Parquet)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(30.456 334.818964)">append-only, sobrescritura por partición</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(30.456 344.706589)">estadistica  por año y mes</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(30.456 354.410277)">visita       por fecha</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(30.456 364.113964)">errores      por fecha de proceso</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #bf8f00" x="364.14" y="326.869152" transform="rotate(-0 364.14 326.869152)">visitante (Kudu)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(269.136 339.402777)">UPSERT nativo por llave primaria</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(269.136 349.538464)">único agregado mutable del modelo</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #595959" transform="translate(269.136 359.242152)">consultado desde Impala</text>
   </g>
